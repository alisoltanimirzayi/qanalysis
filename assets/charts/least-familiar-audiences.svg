<svg xmlns="http://www.w3.org/2000/svg" id="wave-five-only" viewBox="0 0 820 455" role="img" aria-labelledby="title desc" xml:lang="fa" font-family="ChartZar, Tahoma, sans-serif" font-size="30">
  <title id="title">سهم گروه کم‌آشنا با فعالیت‌های سازمان</title>
  <desc id="desc">نمودار میله‌ای سهم از نمونه: موج ۲، ۷۵٫۷۱ درصد. موج ۳، ۵۰٫۱۰ درصد. موج ۴، ۳۷٫۷۵ درصد. موج ۵، ۴۱٫۷۳ درصد.</desc>
  <style>
    @font-face{font-family:ChartZar;src:url(data:font/woff;base64,) format("woff")}
    svg:has(.bar-row:target) .bar-row:not(:target) { opacity: .24 }
    svg:has(.bar-row:target) .plot-frame { display: none }
    svg:target :is(.plot-frame, .bar-row:not(#wave-5), .wave-labels text:not(:last-child)) { display: none }
  </style>
  <g class="plot-frame">
    <path d="M110 30V400 M238 30V400 M366 30V400 M494 30V400 M622 30V400 M750 30V400" fill="none" stroke="#d7ded5" stroke-width="2" />
    <path d="M110 400H750 M110 400V409 M238 400V409 M366 400V409 M494 400V409 M622 400V409 M750 400V409" fill="none" stroke="#8c9a91" stroke-width="2" />
    <g fill="#53665d" text-anchor="middle" direction="ltr">
      <text x="110" y="438">۰٪</text>
      <text x="238" y="438">۲۰٪</text>
      <text x="366" y="438">۴۰٪</text>
      <text x="494" y="438">۶۰٪</text>
      <text x="622" y="438">۸۰٪</text>
      <text x="750" y="438">۱۰۰٪</text>
    </g>
  </g>
  <g class="wave-labels" fill="#20352e" text-anchor="middle" direction="rtl">
    <text x="60" y="85">موج ۲</text>
    <text x="60" y="175">موج ۳</text>
    <text x="60" y="265">موج ۴</text>
    <text x="60" y="355">موج ۵</text>
  </g>
  <g class="bar-row" id="wave-2">
    <rect x="110" y="55" width="484.544" height="40" rx="3" fill="#547c65" />
    <text x="608.544" y="85" fill="#153d34" direction="ltr">۷۵٫۷۱٪</text>
  </g>
  <g class="bar-row" id="wave-3">
    <rect x="110" y="145" width="320.64" height="40" rx="3" fill="#547c65" />
    <text x="444.64" y="175" fill="#153d34" direction="ltr">۵۰٫۱۰٪</text>
  </g>
  <g class="bar-row" id="wave-4">
    <rect x="110" y="235" width="241.6" height="40" rx="3" fill="#547c65" />
    <text x="365.6" y="265" fill="#153d34" direction="ltr">۳۷٫۷۵٪</text>
  </g>
  <g class="bar-row" id="wave-5">
    <rect x="110" y="325" width="267.072" height="40" rx="3" fill="#d8b981" stroke="#80643b" stroke-width="1.5" />
    <text x="391.072" y="355" fill="#153d34" direction="ltr">۴۱٫۷۳٪</text>
  </g>
</svg>
