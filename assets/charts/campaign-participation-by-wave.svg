<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 362" role="img" aria-labelledby="title desc" xml:lang="fa">
  <title id="title">شرکت در مسابقات پویش زندگی با آیه‌ها در موج‌های سوم تا پنجم</title>
  <desc id="desc">موج سوم: میانگین ۲٫۴۹٪، بازه‌ی اطمینان ۹۵٪ از ۱٫۹۱٪ تا ۳٫۲۶٪. موج چهارم: میانگین ۴٫۷۰٪، بازه‌ی اطمینان ۹۵٪ از ۳٫۶۵٪ تا ۶٫۰۴٪. موج پنجم: میانگین ۴٫۴۰٪، بازه‌ی اطمینان ۹۵٪ از ۲٫۷۵٪ تا ۶٫۹۹٪.</desc>
